services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
    volumes:
      - nexus_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${NEXUS_S3_ACCESS_KEY:?Set NEXUS_S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${NEXUS_S3_SECRET_KEY:?Set NEXUS_S3_SECRET_KEY in .env}
    volumes:
      - nexus_objects:/data
    restart: unless-stopped
    networks:
      - internal
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
      do sleep 2; done;
      mc mb --ignore-existing local/nexus-evidence
    environment:
      MINIO_ROOT_USER: ${NEXUS_S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${NEXUS_S3_SECRET_KEY:?}
    depends_on:
      - minio
    networks:
      - internal
    restart: "no"
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-nexus}
      NEXUS_BOOTSTRAP_TOKEN: ${NEXUS_BOOTSTRAP_TOKEN:?Set NEXUS_BOOTSTRAP_TOKEN in .env}
      NEXUS_CORS_ORIGINS: ${NEXUS_CORS_ORIGINS:-http://localhost:3000}
      NEXUS_COOKIE_SECURE: ${NEXUS_COOKIE_SECURE:-false}
      NEXUS_S3_ENDPOINT: http://minio:9000
      NEXUS_S3_ACCESS_KEY: ${NEXUS_S3_ACCESS_KEY:?Set NEXUS_S3_ACCESS_KEY in .env}
      NEXUS_S3_SECRET_KEY: ${NEXUS_S3_SECRET_KEY:?Set NEXUS_S3_SECRET_KEY in .env}
      NEXUS_S3_BUCKET: nexus-evidence
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - internal
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    networks:
      - internal
    restart: unless-stopped
volumes:
  nexus_pg:
  nexus_objects:
networks:
  internal:
    driver: bridge
