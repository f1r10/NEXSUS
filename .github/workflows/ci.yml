name: NEXUS CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API and test dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run security and API tests
        working-directory: backend
        run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend packages
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Next.js production build
        working-directory: frontend
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        env:
          POSTGRES_USER: nexustest
          POSTGRES_PASSWORD: test-only-not-a-real-secret
          NEXUS_BOOTSTRAP_TOKEN: test-only-bootstrap-very-long-not-real
          NEXUS_S3_ACCESS_KEY: nexustest
          NEXUS_S3_SECRET_KEY: test-only-minio-secret-not-real
        run: docker compose config --quiet
